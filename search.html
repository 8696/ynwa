<!DOCTYPE html>
<html lang="zh-CN" data-pm-title="search">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <script src="assets/js/config.js"></script>
  <meta name="description" content="在全部文章中搜索" />
  <script src="assets/js/vendor/tailwindcss.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/vendor/highlight.github.min.css" />
</head>
<body class="min-h-screen flex flex-col bg-white text-[#1c1c1e] antialiased">

  <header class="header-blur sticky top-0 z-50 border-b border-[#f2f2f7]">
    <div class="max-w-[784px] mx-auto px-8 min-h-16 flex items-stretch justify-start gap-8">
      <a href="index.html" class="site-title shrink-0 self-center text-[26px] font-semibold text-[#1c1c1e] tracking-tight no-underline hover:opacity-60 transition-opacity duration-200">YNWA</a>
      <nav id="nav-categories" class="flex flex-1 min-w-0 items-center justify-start flex-wrap gap-x-0.5"></nav>
    </div>
  </header>

  <main class="max-w-[784px] mx-auto px-8 flex-1 w-full">

    <div class="pt-12 pb-9 border-b border-[#e5e5ea] mb-9">
      <p class="text-[13px] font-medium tracking-[0.12em] uppercase text-[#8e8e93] mb-2">文章搜索</p>
      <h1 class="text-[40px] font-semibold tracking-[-0.03em] leading-[1.05]">搜索</h1>
      <p class="mt-2 text-[17px] font-normal text-[#8e8e93] leading-relaxed">输入关键词，在全部文章条目的字段值中匹配</p>
    </div>

    <div class="mb-8">
      <label for="search-input" class="sr-only">搜索关键词</label>
      <input
        type="search"
        id="search-input"
        autocomplete="off"
        placeholder="输入关键词…"
        class="w-full px-4 py-3.5 text-[16px] rounded-xl border border-[#e5e5ea] bg-[#fafafa] text-[#1c1c1e] placeholder:text-[#aeaeb2] focus:outline-none focus:ring-2 focus:ring-[#1c1c1e]/10 focus:border-[#c7c7cc] transition-shadow"
      />
      <p id="search-hint" class="mt-2 text-[13px] text-[#8e8e93] leading-relaxed"><code class="text-[12px] font-mono">结果最多显示 50 条</code></p>
    </div>

    <div id="search-results" class="flex flex-col min-h-[120px]">
      <div class="py-12 text-center text-[#8e8e93] text-[15px] font-normal">加载中…</div>
    </div>

  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/render.js"></script>
  <script>
    (async () => {
      renderFooter();
      const db = await loadDB();
      await renderNav({ type: 'search' });

      const input = document.getElementById('search-input');
      const out = document.getElementById('search-results');

      function render(query) {
        const q = (query || '').trim();
        if (!q) {
          out.innerHTML = '';
          return;
        }
        const rows = searchDatabaseAllFields(db, q);
        if (rows.length === 0) {
          out.innerHTML = '<div class="py-12 text-center text-[#8e8e93] text-[15px] font-normal">未找到匹配项</div>';
          return;
        }
        const visibleRows = rows.slice(0, SEARCH_MAX_RESULTS);
        const isTruncated = rows.length > SEARCH_MAX_RESULTS;
        const extra =
          isTruncated
            ? '<p class="mb-4 text-[13px] text-amber-800 bg-amber-50 border border-amber-100 rounded-lg px-3 py-2">结果已截断为前 ' + SEARCH_MAX_RESULTS + ' 条，请缩小关键词范围。</p>'
            : '';
        out.innerHTML =
          extra +
          '<p class="text-[14px] text-[#8e8e93] mb-4">共 ' +
          visibleRows.length +
          ' 条结果</p><div class="flex flex-col">' +
          visibleRows.map(r => renderSearchResultRow(r, q, db)).join('') +
          '</div>';
      }

      function setUrlQ(q) {
        const u = new URL(location.href);
        if (q) u.searchParams.set('q', q);
        else u.searchParams.delete('q');
        history.replaceState(null, '', u.pathname + u.search);
      }

      let t = null;
      function schedule() {
        const v = input.value;
        if (t) clearTimeout(t);
        t = setTimeout(() => {
          setUrlQ(v.trim());
          render(v);
        }, 200);
      }

      const initialQ = getParam('q') || '';
      input.value = initialQ;
      render(initialQ);

      input.addEventListener('input', schedule);
    })();
  </script>
</body>
</html>
