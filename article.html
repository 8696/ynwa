<!DOCTYPE html>
<html lang="zh-CN" data-pm-title="post">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/vendor/tailwindcss.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/vendor/highlight.github.min.css" />
</head>
<body class="min-h-screen flex flex-col bg-white text-[#1c1c1e] antialiased">

  <!-- ============================================================
       顶栏
       ============================================================ -->
  <header class="header-blur sticky top-0 z-50 border-b border-[#f2f2f7]">
    <div class="max-w-[784px] mx-auto px-8 min-h-16 flex items-stretch justify-start gap-8">
      <a href="index.html" class="site-title shrink-0 self-center text-[26px] font-semibold text-[#1c1c1e] tracking-tight no-underline hover:opacity-60 transition-opacity duration-200">YNWA</a>
      <nav id="nav-categories" class="flex flex-1 min-w-0 items-center justify-start flex-wrap gap-x-0.5"></nav>
    </div>
  </header>

  <!-- ============================================================
       主体内容
       ============================================================ -->
  <main class="max-w-[784px] mx-auto px-8 flex-1 w-full">

    <!-- 文章头部：初始隐藏，找到文章后由 JS 显示 -->
    <div id="post-header" class="pt-12 pb-9 border-b border-[#e5e5ea] mb-9" style="display:none">
      <!-- 返回链接：有上一页时回退，否则隐藏 -->
      <a id="back-link" href="index.html" class="cursor-pointer inline-flex items-center gap-1.5 text-[15px] font-normal text-[#8e8e93] pb-4 hover:text-[#1c1c1e] no-underline">← 返回</a>

      <!-- 文章标题 -->
      <h1 id="post-title" class="text-[38px] font-semibold tracking-[-0.03em] leading-[1.12] mb-3 text-[#1c1c1e]"></h1>

      <!-- 文章摘要（来自 db.json 的 summary 字段） -->
      <p id="post-summary" class="text-[17px] text-[#8e8e93] font-normal leading-relaxed mb-5"></p>

      <!-- 时间 + 分类 + 标签（与列表卡片同一结构） -->
      <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
        <!-- id="post-date"：JS 填入格式化后的日期 -->
        <time id="post-date" class="text-[13px] font-normal text-[#8e8e93] whitespace-nowrap">—</time>
        <!-- id="post-cats"：JS 填入分类名和跳转链接（支持多个） -->
        <span id="post-cats" class="flex flex-wrap items-center gap-x-2 gap-y-1"></span>
        <!-- 标签列表：JS 动态生成 -->
        <div id="post-tags" class="flex flex-wrap items-center gap-x-2 gap-y-1 min-w-0"></div>
      </div>
    </div>

    <!-- Markdown 渲染区域：
         .markdown-body 使用接近 GitHub 的排版样式；
         初始显示加载占位，JS fetch 完成后替换为解析后的 HTML -->
    <div id="post-content" class="markdown-body pb-16">
      <div class="py-20 text-center text-[#8e8e93] text-[15px] font-normal">加载中…</div>
    </div>

  </main>

  <!-- ============================================================
       页脚
       ============================================================ -->
  <footer id="site-footer"></footer>

  <script src="assets/js/vendor/marked.min.js"></script>
  <script src="assets/js/vendor/highlight.min.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/pagination.js"></script>
  <script src="assets/js/render.js"></script>
  <script>
    (async () => {
      renderFooter();

      // 从 URL 读取文章 id，例如 ?id=001
      const id = getParam('id');
      const db = await loadDB();

      // 详情页不激活分类导航
      await renderNav({ type: 'home' });

      // 在数据库中查找对应文章
      const post = db.posts.find(p => p.id === id);
      const contentEl = document.getElementById('post-content');

      // 找不到文章时显示错误提示，不继续执行
      if (!post) {
        contentEl.innerHTML = '<div class="py-20 text-center text-[#8e8e93]">文章不存在</div>';
        return;
      }

      // 更新浏览器标签页标题
      document.title = `${post.title} · ${getSiteName()}`;

      // 文章找到后才显示头部区域
      document.getElementById('post-header').style.display = '';

      // 填入分类信息（支持多个分类）
      const catList = getCategoryList(db, post.category);
      const catCls = 'cursor-pointer text-[12px] font-medium text-[#636366] px-2 py-0.5 bg-[#f2f2f7] rounded-full hover:bg-[#e5e5ea] no-underline transition-colors duration-150';
      document.getElementById('post-cats').innerHTML = catList
        .map(c => `<a href="category.html?id=${encodeURIComponent(c.id)}" class="${catCls}">${c.name}</a>`)
        .join('');

      // 返回按钮：有上一页则回退，没有则隐藏
      const backLink = document.getElementById('back-link');
      if (window.history.length > 1) {
        backLink.href = '#';
        backLink.addEventListener('click', (e) => {
          e.preventDefault();
          window.history.back();
        });
      } else {
        backLink.style.display = 'none';
      }

      // 填入其他元数据
      document.getElementById('post-date').textContent = formatDate(post.date);
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-summary').textContent = post.summary || '';

      // 标签：可点击，进入 tag.html
      document.getElementById('post-tags').innerHTML = renderTagLinks(post.tags, db);

      // 加载并渲染 Markdown 文件
      try {
        const res = await fetch(post.file);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const mdText = await res.text();

        // 开启 GitHub Flavored Markdown（表格、代码块等）
        marked.setOptions({ gfm: true, breaks: false });
        contentEl.innerHTML = marked.parse(mdText);

        // 对所有代码块做语法高亮
        contentEl.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

        // 外部链接在新标签页打开，提升阅读体验
        contentEl.querySelectorAll('a[href^="http"]').forEach(a => {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        });

      } catch (err) {
        // fetch 失败时显示错误原因（常见：文件路径错误或服务器未启动）
        contentEl.innerHTML = `<div class="py-20 text-center text-[#8e8e93]">文章内容加载失败：${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
